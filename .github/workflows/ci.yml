# Offline test suite on Linux and macOS for Python 3.12; the same steps run locally with `make ci` (scripts/ci_local.sh).
# Python 3.11 is not in the matrix: requires-python is >= 3.12, the only version verified with the real
# py-rust-stemmers wheel. Re-add 3.11 (and lower requires-python) only after a green 3.11 run.
# Tests use invented data only; no benchmark file, model download, provider key or network call is needed by any test.
name: offline-cpu
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12"]
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package with test and parquet extras
        run: python -m pip install '.[test,parquet]' 'setuptools>=77'
      - name: Offline test suite
        run: python -m pytest -o addopts= -q -p no:cacheprovider
      - name: Release-hygiene scan
        run: python scripts/hygiene_scan.py --root .
      - name: Build sdist and wheel
        run: python -m build --outdir "$RUNNER_TEMP/memaudit-dist" .
      - name: Clean wheel installation, CLI and synthetic examples
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-check"
          W="$RUNNER_TEMP/wheel-check/bin"
          for wheel_path in "$RUNNER_TEMP"/memaudit-dist/*.whl; do
            "$W/python" -m pip install "${wheel_path}[parquet]" pytest
          done
          cd "$RUNNER_TEMP"
          "$W/memaudit" --version
          "$W/memaudit" replica rehearse --ledger "$RUNNER_TEMP/ledger.jsonl" --output "$RUNNER_TEMP/rehearsal.json"
          for ex in synthetic_audit synthetic_nulls synthetic_qi aggregate_arithmetic; do
            "$W/python" "$GITHUB_WORKSPACE/examples/$ex.py"
          done
          mkdir -p "$RUNNER_TEMP/replica-example"
          "$W/python" "$GITHUB_WORKSPACE/examples/replica_rehearsal.py" "$RUNNER_TEMP/replica-example"
      - name: Installed-wheel test suite
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/wheel-check/bin/python" -m pytest -o addopts= -q -p no:cacheprovider --import-mode=importlib
  hybrid-extra:
    name: optional hybrid extra installed (ubuntu, Python 3.12)
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package with the hybrid extra (no model is downloaded)
        run: python -m pip install '.[test,hybrid]'
      - name: Hybrid and QI tests (fake encoder; the real-model smoke test skips without a local model)
        run: python -m pytest -o addopts= -q -p no:cacheprovider tests/test_hybrid.py tests/test_qi.py
